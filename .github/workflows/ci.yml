name: DevOpsPulse CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -f docker/Dockerfile \
            -t devopspulse:test .

      - name: Run Docker container
        run: |
          docker run -d \
            --name devopspulse-test \
            -p 5000:5000 \
            devopspulse:test

      - name: Wait for application
        run: |
          sleep 5

      - name: Test application
        run: |
          curl --fail http://localhost:5000/

      - name: Test health endpoint
        run: |
          curl --fail http://localhost:5000/health

      - name: Stop container
        if: always()
        run: |
          docker stop devopspulse-test || true
          docker rm devopspulse-test || true
