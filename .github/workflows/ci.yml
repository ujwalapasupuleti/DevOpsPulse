name: DevOpsPulse CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-test-publish:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -f docker/Dockerfile \
            -t devopspulse:test .

      - name: Run Docker container
        run: |
          docker run -d \
            --name devopspulse-test \
            -p 5000:5000 \
            devopspulse:test

      - name: Wait for application
        run: sleep 5

      - name: Test application
        run: curl --fail http://localhost:5000/

      - name: Test health endpoint
        run: curl --fail http://localhost:5000/health

      - name: Stop test container
        if: always()
        run: |
          docker stop devopspulse-test || true
          docker rm devopspulse-test || true

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build production image
        if: github.event_name == 'push'
        run: |
          docker build \
            -f docker/Dockerfile \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/devopspulse:latest \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/devopspulse:${{ github.sha }} .

      - name: Push Docker image
        if: github.event_name == 'push'
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/devopspulse:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/devopspulse:${{ github.sha }}
